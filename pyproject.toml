[project]
name = "pfn-cookbook"
version = "0.1.0"
description = "Prior-Data Fitted Networks(PFN)를 단계별로 이해하는 cookbook"
readme = "README.md"
authors = [
    { name = "Aiden-Jeon", email = "aiden.jongseob@gmail.com" }
]
requires-python = ">=3.12"
# 하한은 Databricks Serverless GPU 환경 v6에 맞춘다.
# torch는 그 환경에서 테스트된 2.11(CUDA 13.0 빌드)로 고정해 로컬과 버전을 맞춘다.
dependencies = [
    "matplotlib>=3.10",
    "numpy>=2.3",
    "scikit-learn>=1.7",
    "scipy>=1.16",
    "torch>=2.11,<2.12",
    "tqdm>=4.67",
]

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.9",
    "jupyterlab>=4.6.4",
    "nbstripout>=0.9.1",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
