# GP prior PFN 학습: databricks air run -f air/train_pfn.yaml --watch -p e2-demo-field-eng
# 기본은 실행 확인용(large, 500 step). 논문 재현은 override로 바꾼다:
#   --override env_variables.PFN_CONFIG_NAME=paper --override env_variables.PFN_STEPS=10000 \
#   --override mlflow_run_name=paper-10000steps --override timeout_minutes=240
experiment_name: pfn-gp-reproduction
mlflow_experiment_directory: /Workspace/Users/jongseob.jeon@databricks.com/pfn-cookbook
mlflow_run_name: large-500steps
environment:
  version: databricks_ai_v6
compute:
  accelerator_type: GPU_1xA10
  num_accelerators: 1
code_source:
  type: snapshot
  snapshot:
    root_path: ..
    include_paths:
      - src
      - scripts
env_variables:
  PFN_CONFIG_NAME: large
  PFN_STEPS: "500"
# 실패한 학습을 그대로 재시도하면 MLflow run만 늘어난다
max_retries: 0
timeout_minutes: 60
command: >-
  PYTHONPATH=$CODE_SOURCE_PATH/src
  python $CODE_SOURCE_PATH/scripts/train_pfn.py
